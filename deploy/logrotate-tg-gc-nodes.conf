# Rotation for node logs, installed at /etc/logrotate.tg-gc-nodes.conf and
# driven by logrotate-tg-gc.timer (hourly) instead of the system daily run.
#
# "su root ubuntu" is required: main.log is created by systemd
# (StandardOutput=append:) and therefore owned by root, so copytruncate must
# run as root; the group must stay ubuntu because the logs directory is
# group-writable by ubuntu and logrotate otherwise refuses to touch it.
/home/ubuntu/tg-gc/tg-gc-server*/logs/*.log {
    su root ubuntu
    hourly
    rotate 4
    maxsize 200M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
